:root{--bg:#fef3ec;--card:#fffaf6;--line:#efd3c6;--fg:#4a2a1e;--muted:#7a5445;--rust:#b0441c;--rose:#d98a8a}
@media (prefers-color-scheme:dark){:root{--bg:#2a1a1a;--card:#3a2524;--line:#573837;--fg:#f7e6dc;--muted:#c8a597;--rust:#ec9a72;--rose:#e8a3a6}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Hind Siliguri",system-ui,sans-serif;display:grid;place-items:center;padding:24px 16px;text-align:center}
